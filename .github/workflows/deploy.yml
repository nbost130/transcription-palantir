name: 🚀 Deploy to Production

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy to Mithrandir
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔗 Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        tags: tag:ci

    - name: 🔐 Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.MITHRANDIR_SSH_KEY }}

    - name: 📝 Add SSH known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H 100.77.230.53 >> ~/.ssh/known_hosts

    - name: 🚀 Deploy to production
      run: |
        ssh nbost@100.77.230.53 << 'ENDSSH'
          set -e
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"

          echo "📂 Navigating to project directory..."
          cd /home/nbost/transcription-palantir

          echo "🔍 Checking for divergent branches..."
          git fetch origin

          echo "🔄 Syncing with GitHub (using reset to handle divergence)..."
          git reset --hard origin/main
          
          echo "📦 Installing dependencies..."
          npm install
          
          echo "🔨 Building project..."
          npm run build

          echo "🔄 Restarting service..."
          # No manual pkill here: the unit has KillMode=control-group and
          # ExecStopPost=fuser -k 9003/tcp for orphans, and a pkill immediately
          # before restart raced systemd's Restart=on-failure/RestartSec=10,
          # leaving the unit "activating" when the old single is-active check
          # ran (2026-06-15, 2026-06-22 deploy failures, exit 3 five seconds in).
          systemctl --user restart transcription-palantir

          echo "🔍 Waiting for service to become active..."
          ACTIVE_OK=""
          for i in $(seq 1 15); do
            if systemctl --user is-active --quiet transcription-palantir; then
              ACTIVE_OK="1"
              break
            fi
            sleep 2
          done
          if [ -z "$ACTIVE_OK" ]; then
            echo "❌ Service did not become active within 30s"
            systemctl --user status transcription-palantir --no-pager -l
            tail -50 logs/service.log || true
            exit 1
          fi
          echo "✅ Service is active"

          echo "✅ Verifying deployment readiness..."
          # Poll the deep readiness probe (not /api/v1/health, which is liveness-only
          # and stayed green through the 2026-08-28..09-06 rate-limiter incident).
          READY_OK=""
          for i in $(seq 1 15); do
            READY_CODE=$(curl -s --max-time 5 -o /tmp/ready-body.json -w '%{http_code}' http://localhost:9003/api/v1/ready || echo 000)
            if [ "$READY_CODE" = "200" ]; then
              READY_OK="1"
              break
            fi
            sleep 2
          done
          if [ -z "$READY_OK" ]; then
            echo "❌ /api/v1/ready did not return 200 within 30s (last: $READY_CODE)"
            echo "Last response body:"
            cat /tmp/ready-body.json 2>/dev/null || true
            systemctl --user status transcription-palantir --no-pager -l || true
            tail -50 logs/service.log || true
            exit 1
          fi
          echo "✅ Service is ready"

          echo "🕐 Verifying fresh deployment..."
          # Verify uptime is recent (less than 60 seconds = fresh restart).
          # uptime still comes from /api/v1/health (liveness) - that field is unchanged.
          HEALTH_BODY=$(curl -s --max-time 5 http://localhost:9003/api/v1/health || echo '{}')
          UPTIME=$(echo "$HEALTH_BODY" | jq -r '.uptime')
          if ! echo "$HEALTH_BODY" | jq -e 'has("uptime") and .uptime < 60' >/dev/null 2>&1; then
            echo "⚠️  WARNING: Service appears stale (uptime: ${UPTIME}s)"
            echo "This might indicate the restart failed and old instance is still running"
            exit 1
          fi
          echo "✅ Service is fresh (uptime: ${UPTIME}s)"
          
          echo "🎉 Deployment successful!"
        ENDSSH
        
    - name: 🔍 Verify deployment
      run: |
        # Wait a bit more for full startup
        sleep 3

        # Check readiness (not just liveness) from outside the tailnet host itself
        READY=$(curl -s http://100.77.230.53:9003/api/v1/ready | jq -r '.status')
        if [ "$READY" != "ready" ]; then
          echo "❌ Readiness check failed: $READY"
          exit 1
        fi

        echo "✅ Deployment verified - service is ready"
        
    - name: 📊 Deployment summary
      if: always()
      run: |
        echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment:** Production (Mithrandir)" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Endpoints:**" >> $GITHUB_STEP_SUMMARY
        echo "- Health: http://100.77.230.53:9003/api/v1/health" >> $GITHUB_STEP_SUMMARY
        echo "- Services: http://100.77.230.53:9003/api/services/health" >> $GITHUB_STEP_SUMMARY
        echo "- Dashboard: http://100.77.230.53:3000/services" >> $GITHUB_STEP_SUMMARY

